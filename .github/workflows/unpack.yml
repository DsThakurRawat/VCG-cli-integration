name: unpack-source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused fix and verify tree
        run: |
          set -e
          f=$(ls [0-9]*-fix5.patch | head -1)
          git apply "$f"
          git rm -q -f -- "$f"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Quarantine on uncertain remote completion, fail-closed lock"
          export GIT_INDEX_FILE=/tmp/idx
          git read-tree HEAD
          git rm --cached -q .github/workflows/unpack.yml
          got=$(git write-tree)
          echo "tree $got expected 43a316b6ad3c779674bffd8d115cdda425b3e76e"
          test "$got" = "43a316b6ad3c779674bffd8d115cdda425b3e76e"
          unset GIT_INDEX_FILE
          git push
