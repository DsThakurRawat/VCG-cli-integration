name: unpack-source
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tree equals audited tree
        run: |
          export GIT_INDEX_FILE=/tmp/idx
          git read-tree HEAD
          git rm --cached -q .github/workflows/unpack.yml
          got=$(git write-tree)
          echo "tree $got expected 1aba77b5231f09dbf91db82deacad3371f073173"
          git ls-files | wc -l
          test "$got" = "1aba77b5231f09dbf91db82deacad3371f073173"
