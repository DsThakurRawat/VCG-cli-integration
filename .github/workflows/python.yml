name: Python bridge

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Vendored bridge-lite install + lock tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install vendored package
        run: pip install ./python pytest
      - name: Byte-compile vendored package
        run: python -m compileall -q python/src
      - name: Cross-bridge lock tests
        run: python -m pytest tests/python -v
      - name: Install bridge-lite test extras
        run: pip install './python[dev]'
      - name: Vendored bridge-lite suite (offline), default umask
        working-directory: python
        run: >-
          python -m pytest tests -q -o addopts=
          --ignore=tests/test_bridge_live.py --ignore=tests/test_bridge_live_gds.py
          --ignore=tests/test_daemon_lifecycle_live.py
      - name: Vendored bridge-lite suite (offline), umask 0002
        working-directory: python
        run: >-
          umask 0002 && python -m pytest tests -q -o addopts=
          --ignore=tests/test_bridge_live.py --ignore=tests/test_bridge_live_gds.py
          --ignore=tests/test_daemon_lifecycle_live.py
